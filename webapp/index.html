<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2D123F">
  <meta name="description" content="Explore computer science through interactive lessons, animated visualizations, theory, and line-by-line pseudocode.">
  <title>CS Concept Lab · @abodbuilds</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232D123F'/%3E%3Cpath d='M16 43V29h8v14zm12 0V16h8v27zm12 0V23h8v20z' fill='%23F4D35E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="algorithms.js" defer></script>
  <!-- lesson-modules -->
  <script src="lesson-view.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workbench" data-i18n="skip">انتقل للتجربة</a>
  <div class="app-shell">
    <header class="site-header" dir="ltr">
      <a class="wordmark" href="#binary-search" aria-label="CS Concept Lab home">CS CONCEPT<span class="wordmark-light">LAB</span></a>
      <button class="language-switch" id="language" aria-label="Switch to English">EN</button>
    </header>
    <div class="workspace" dir="ltr">
      <aside class="sidebar" aria-label="CS concept library">
        <div class="library-mobile"><select id="algorithm-select" aria-label="Concept"></select></div>
        <nav class="algorithm-nav" aria-label="Concepts"></nav>
      </aside>
      <main id="workbench" tabindex="-1">
        <section class="lesson-header"><h1 id="lesson-title" dir="ltr">Binary Search</h1><div class="input-actions" id="input-actions"><button class="text-button" id="new-example" data-i18n="newExample">مثال جديد</button><button class="secondary-button compact" id="edit-input" aria-expanded="false" aria-controls="input-editor" data-i18n="editInput">المدخلات</button></div></section>
        <div class="view-tabs" role="tablist" aria-label="Lesson view"><button id="theory-tab" role="tab" aria-selected="false" aria-controls="theory-panel" tabindex="-1" data-i18n="theory">الشرح</button><button id="explore-tab" role="tab" aria-selected="true" aria-controls="explore-panel" tabindex="0" data-i18n="explore">التجربة</button></div>
        <section id="explore-panel" role="tabpanel" aria-labelledby="explore-tab">
          <form id="input-editor" class="input-editor" hidden novalidate>
            <div id="lesson-input-fields" class="lesson-input-fields" hidden></div>
            <div class="input-fields" id="legacy-input-fields"><label class="array-field"><span data-i18n="arrayLabel">الأرقام</span><input id="array-input" type="text" dir="ltr" autocomplete="off" spellcheck="false" aria-describedby="input-help input-error"></label><label class="target-field" id="target-field"><span data-i18n="targetLabel">المطلوب · target</span><input id="target-input" type="text" inputmode="numeric" dir="ltr" autocomplete="off" aria-describedby="input-error"></label></div>
            <p class="input-help" id="input-help" data-i18n="inputHelp">لحد 16 عدد صحيح من -999 لـ 999، بينهم فاصلة. سيبها فاضية لتجربة الصف الفاضي.</p>
            <p class="input-error" id="input-error" role="alert" hidden></p>
            <div class="editor-bottom"><div id="lesson-presets" class="presets" hidden></div><div class="presets" id="legacy-presets"><button type="button" data-preset="default" data-i18n="presetDefault">المثال الأصلي</button><button type="button" data-preset="edge" id="edge-preset">مش موجود</button><button type="button" data-preset="duplicates" data-i18n="duplicates">قيم مكرّرة</button><button type="button" data-preset="empty" data-i18n="empty">صف فاضي</button></div><div class="editor-actions"><button type="button" class="text-button" id="cancel-input" data-i18n="cancel">إلغاء</button><button type="button" id="sort-apply" class="secondary-button compact" hidden data-i18n="sortApply">رتّب وطبّق</button><button class="primary-button compact" type="submit" data-i18n="apply">طبّق</button></div></div>
          </form>
          <div class="lab-grid">
            <section class="visual-panel panel" aria-label="Concept visualization">
              <div class="step-story" aria-live="polite" aria-atomic="true"><h2 id="step-title"></h2><pre class="step-code" id="step-code" dir="ltr" hidden></pre><div class="equation" id="step-equation" dir="ltr" hidden></div><details class="step-details"><summary data-i18n="explanation">تفسير الخطوة</summary><p id="step-explanation"></p></details></div>
              <div class="stage" id="stage" dir="ltr"><div class="stage-grid" aria-hidden="true"></div><div class="target-capsule" id="target-capsule"><span>target</span><strong id="target-display">71</strong></div><div class="held-label" id="held-label" hidden>value</div><div class="array-label">numbers</div><div class="slot-layer" id="slot-layer"></div><div class="card-layer" id="card-layer"></div><div class="empty-state" id="empty-state" hidden><b data-i18n="emptyArray">الصف فاضي</b></div></div>
              <div class="variables" id="variables" dir="ltr"></div>
            </section>
            <section class="code-panel panel" aria-label="Pseudocode"><div class="panel-heading code-heading"><h2>Pseudocode</h2><button id="copy-code" class="icon-button" aria-label="Copy pseudocode" title="Copy pseudocode"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="8" y="8" width="11" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></svg></button></div><div class="code-scroll" id="code-scroll" dir="ltr"><ol class="code-lines" id="code-lines"></ol></div><details class="metrics-details"><summary data-i18n="operationCounts">عدادات التنفيذ</summary><div class="metrics" id="metrics"></div></details></section>
          </div>
          <section class="playback panel" aria-label="Playback controls"><div class="transport" dir="ltr"><button class="icon-button" id="reset" aria-label="Reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button><button class="icon-button" id="previous" aria-label="Previous step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M18 5l-9 7 9 7z"/></svg></button><button class="primary-button play-button" id="play"><span id="play-symbol" aria-hidden="true">▶</span><span id="play-label">شغّل</span></button><button class="icon-button" id="next" aria-label="Next step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M6 5l9 7-9 7z"/></svg></button></div><div class="scrubber"><input type="range" id="timeline" min="0" max="1" value="0" step="1" aria-label="Execution step"><span id="step-count" dir="ltr">0 / 0</span></div><select id="detail" class="speed-select detail-select" aria-label="Step detail"><option value="key" data-i18n="keySteps">الخطوات المهمة</option><option value="all" data-i18n="everyLine">كل سطر</option></select><select id="speed" class="speed-select" aria-label="Playback speed" dir="ltr"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></section>
        </section>
        <section id="theory-panel" role="tabpanel" aria-labelledby="theory-tab" hidden></section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
