name: Algorithm Lab checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check algorithms and lesson contracts
        run: npm run test:web
      - name: Build the standalone app
        run: npm run build:web
